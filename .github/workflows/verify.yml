name: Verify public report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        # This repository is a report/evidence tree, not an installable Python
        # package.  Keep the cold-start verifier explicit so setuptools never
        # attempts to package top-level evidence and publication directories.
        run: >-
          python -m pip install
          "matplotlib==3.10.8"
          "pillow==12.1.1"
          "pre-commit==4.6.0"
          "ruff==0.15.21"
      - name: Run repository hygiene hooks
        run: pre-commit run --all-files
      - name: Run deterministic verification
        run: make verify-all

  release-assets:
    if: startsWith(github.ref, 'refs/tags/gdn-sm90a-r')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and independently verify deterministic release assets
        run: >-
          make release-assets verify-release-assets
          RELEASE_TAG="${GITHUB_REF_NAME}"
